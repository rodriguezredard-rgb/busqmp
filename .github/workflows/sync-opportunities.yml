name: Sincronizar oportunidades

on:
  workflow_dispatch:
    inputs:
      test_recipient:
        description: "Correo para una prueba inmediata (vacío = ejecución normal)"
        required: false
        type: string
      profile_action:
        description: "Acción administrativa: diagnose o disable"
        required: false
        type: string
      profile_name:
        description: "Nombre exacto del perfil para disable"
        required: false
        type: string
  schedule:
    # 08:00 UTC corresponde a las 04:00 de Chile durante horario de invierno.
    - cron: "0 8 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # La sincronizacion se divide en llamadas cortas para respetar el limite
    # serverless, pero el recorrido completo puede necesitar varias paginas.
    timeout-minutes: 15
    steps:
      - name: Actualizar licitaciones y compras ágiles
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.test_recipient == '' && inputs.profile_action == '') }}
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$BACKEND_URL"
          test -n "$CRON_SECRET"
          request() {
            curl --silent --show-error --fail-with-body --location \
              --connect-timeout 10 --max-time 50 \
              --retry 1 --retry-delay 3 --retry-max-time 95 --retry-all-errors \
              -X POST "$1" -H "Authorization: Bearer $CRON_SECRET"
          }

          echo "Sincronizando licitaciones activas..."
          request "$BACKEND_URL/cron/sync-licitaciones"

          page=1
          while true; do
            echo "Sincronizando pagina $page de Compras Agiles..."
            response=$(request "$BACKEND_URL/cron/sync-agile-page?minutes=1500&page=$page&page_size=50")
            echo "$response"
            total_pages=$(echo "$response" | jq -er '.total_pages')
            if [ "$total_pages" -eq 0 ] || [ "$page" -ge "$total_pages" ]; then
              break
            fi
            page=$((page + 1))
          done

          echo "Enviando resumenes pendientes..."
          request "$BACKEND_URL/cron/send-due-digests"
      - name: Enviar resumen de prueba
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_recipient != '' && inputs.profile_action == '' }}
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TEST_RECIPIENT: ${{ inputs.test_recipient }}
        run: |
          test -n "$BACKEND_URL"
          test -n "$CRON_SECRET"
          echo "::add-mask::$TEST_RECIPIENT"
          curl --fail-with-body --location --show-error \
            --connect-timeout 15 --max-time 55 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            -X POST --get --data-urlencode "recipient=$TEST_RECIPIENT" \
            "$BACKEND_URL/cron/test-digest" \
            -H "Authorization: Bearer $CRON_SECRET"
      - name: Diagnosticar perfiles
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile_action == 'diagnose' }}
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TEST_RECIPIENT: ${{ inputs.test_recipient }}
        run: |
          echo "::add-mask::$TEST_RECIPIENT"
          curl --fail-with-body --location --show-error \
            --connect-timeout 15 --max-time 55 \
            --get --data-urlencode "recipient=$TEST_RECIPIENT" \
            "$BACKEND_URL/cron/profile-diagnostics" \
            -H "Authorization: Bearer $CRON_SECRET"
      - name: Deshabilitar perfil
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile_action == 'disable' }}
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TEST_RECIPIENT: ${{ inputs.test_recipient }}
          PROFILE_NAME: ${{ inputs.profile_name }}
        run: |
          echo "::add-mask::$TEST_RECIPIENT"
          curl --fail-with-body --location --show-error \
            --connect-timeout 15 --max-time 55 \
            -X POST --get \
            --data-urlencode "recipient=$TEST_RECIPIENT" \
            --data-urlencode "profile_name=$PROFILE_NAME" \
            "$BACKEND_URL/cron/disable-profile" \
            -H "Authorization: Bearer $CRON_SECRET"
