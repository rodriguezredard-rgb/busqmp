name: Sincronizar oportunidades

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Actualizar licitaciones y compras ágiles
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$BACKEND_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --retry 2 --max-time 240 \
            -X POST "$BACKEND_URL/cron/daily-digests" \
            -H "Authorization: Bearer $CRON_SECRET"
