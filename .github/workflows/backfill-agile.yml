name: Carga inicial Compras Agiles

on:
  schedule:
    # Reconciliación diaria para recuperar publicaciones perdidas por retrasos
    # o cancelaciones del sincronizador incremental.
    - cron: "29 8 * * *"
  workflow_dispatch:
    inputs:
      published_from:
        description: "Inicio ISO-8601 (ej. 2026-07-01T00:00:00Z)"
        required: false
      published_to:
        description: "Fin ISO-8601 (ej. 2026-07-31T23:59:59Z)"
        required: false
      start_page:
        description: "Pagina inicial (usa 1 para una carga nueva)"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Cargar paginas de Compras Agiles
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PUBLISHED_FROM: ${{ inputs.published_from }}
          PUBLISHED_TO: ${{ inputs.published_to }}
          START_PAGE: ${{ inputs.start_page }}
        run: |
          test -n "$BACKEND_URL"
          test -n "$CRON_SECRET"
          if [ -z "$PUBLISHED_FROM" ]; then
            PUBLISHED_FROM=$(date -u -d '7 days ago' '+%Y-%m-%dT00:00:00Z')
          fi
          if [ -z "$PUBLISHED_TO" ]; then
            PUBLISHED_TO=$(date -u '+%Y-%m-%dT23:59:59Z')
          fi
          if [ -z "$START_PAGE" ]; then
            START_PAGE=1
          fi
          echo "Reconciliando publicaciones entre $PUBLISHED_FROM y $PUBLISHED_TO"
          page="$START_PAGE"
          saved_total=0
          while true; do
            echo "Cargando pagina $page..."
            response=$(curl --silent --show-error --fail --location \
              --max-time 240 --retry 8 --retry-delay 15 --retry-max-time 900 --retry-all-errors \
              -X POST "$BACKEND_URL/cron/agile-backfill-page?published_from=$PUBLISHED_FROM&published_to=$PUBLISHED_TO&page=$page&page_size=50" \
              -H "Authorization: Bearer $CRON_SECRET")
            echo "$response"
            total_pages=$(echo "$response" | jq -er '.total_pages')
            saved=$(echo "$response" | jq -er '.saved // 0')
            saved_total=$((saved_total + saved))
            if [ "$total_pages" -eq 0 ] || [ "$page" -ge "$total_pages" ]; then
              break
            fi
            page=$((page + 1))
          done
          echo "Carga completa: $saved_total registros procesados en $page paginas."
