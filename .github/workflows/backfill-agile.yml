name: Carga inicial Compras Agiles

on:
  workflow_dispatch:
    inputs:
      published_from:
        description: "Inicio ISO-8601 (ej. 2026-07-01T00:00:00Z)"
        required: true
      published_to:
        description: "Fin ISO-8601 (ej. 2026-07-31T23:59:59Z)"
        required: true
      max_pages:
        description: "Maximo de paginas en esta ejecucion"
        required: true
        default: "50"
      start_page:
        description: "Pagina inicial para continuar una carga"
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Cargar paginas de Compras Agiles
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PUBLISHED_FROM: ${{ inputs.published_from }}
          PUBLISHED_TO: ${{ inputs.published_to }}
          MAX_PAGES: ${{ inputs.max_pages }}
          START_PAGE: ${{ inputs.start_page }}
        run: |
          test -n "$BACKEND_URL"
          test -n "$CRON_SECRET"
          page="$START_PAGE"
          last_page=$((START_PAGE + MAX_PAGES - 1))
          while [ "$page" -le "$last_page" ]; do
            response=$(curl --silent --show-error --fail-with-body --location --max-time 55 \
              -X POST "$BACKEND_URL/cron/agile-backfill-page?published_from=$PUBLISHED_FROM&published_to=$PUBLISHED_TO&page=$page&page_size=50" \
              -H "Authorization: Bearer $CRON_SECRET")
            echo "$response"
            total_pages=$(echo "$response" | jq -r '.total_pages')
            if [ "$total_pages" -eq 0 ] || [ "$page" -ge "$total_pages" ]; then
              break
            fi
            page=$((page + 1))
          done
