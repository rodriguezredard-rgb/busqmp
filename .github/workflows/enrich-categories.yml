name: Enriquecer rubros

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Fuente: licitacion, compra_agil o both"
        required: true
        default: "both"
      batches:
        description: "Cantidad de lotes de 5 oportunidades"
        required: true
        default: "5"

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Extraer categorias observadas
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SOURCE: ${{ inputs.source || 'both' }}
          BATCHES: ${{ inputs.batches || '5' }}
        run: |
          if [ "$SOURCE" = "both" ]; then
            sources="licitacion compra_agil"
          else
            sources="$SOURCE"
          fi
          for current_source in $sources; do
            for batch in $(seq 1 "$BATCHES"); do
              curl --silent --show-error --fail-with-body --location --max-time 240 \
                -X POST "$BACKEND_URL/cron/enrich-categories?source=$current_source&limit=5" \
                -H "Authorization: Bearer $CRON_SECRET"
              echo
            done
          done
